name = "tinygpt-discord"
output_dir = "runs/tinygpt-discord"

[model]
family = "tinygpt"
context_length = 256
embedding_dim = 256
num_heads = 4
num_layers = 4
hidden_dim = 768
dropout = 0.1
init_std = 0.02
tie_embeddings = true
position_encoding = "rope"

[training]
steps = 5000
batch_size = 16
learning_rate = 0.0003
minimum_learning_rate = 0.00003
warmup_steps = 250
weight_decay = 0.01
max_grad_norm = 1.0
precision = "fp32"
seed = 42
log_every = 100
eval_every = 250
eval_batches = 10
save_every = 500

[data]
train_path = "datasets/discord/input.txt"
validation_fraction = 0.05
tokenizer = "bpe"
tokenizer_vocab_size = 1024
tokenizer_training_characters = 1000000
