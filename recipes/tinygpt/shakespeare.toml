name = "tinygpt-shakespeare"
output_dir = "runs/tinygpt-shakespeare"

[model]
family = "tinygpt"
context_length = 256
embedding_dim = 384
num_heads = 6
num_layers = 6
hidden_dim = 1024
dropout = 0.1
init_std = 0.02
tie_embeddings = true
position_encoding = "rope"

[training]
epochs = 20
max_steps = 1000
batch_size = 64
learning_rate = 0.0003
minimum_learning_rate = 0.00003
warmup_steps = 150 #300
weight_decay = 0.01
max_grad_norm = 1.0
precision = "bf16" #"fp32"
seed = 42
log_every = 100
eval_every = 100
eval_batches = 10
save_every = 500

[data]
train_path = "datasets/tiny_shakespeare/input.txt"
validation_fraction = 0.1
tokenizer = "character"
