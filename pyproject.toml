[project]
name = "purellm"
version = "0.1.0"
description = "Educational language-model implementations built from scratch"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
]
[project.scripts]
download = "scripts:download_dataset.main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["purellm"]
