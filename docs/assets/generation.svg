<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">PureLLM terminal generation</title>
  <desc id="description">A terminal command runs PureLLM with top-k sampling and generates Shakespeare-style dialogue.</desc>
  <defs>
    <clipPath id="window">
      <rect x="1" y="1" width="1198" height="428" rx="17"/>
    </clipPath>
  </defs>
  <g clip-path="url(#window)">
    <rect x="1" y="1" width="1198" height="428" fill="#0d1117"/>
    <rect x="1" y="1" width="1198" height="69" fill="#161b22"/>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="34" cy="35" r="8" fill="#ff5f57"/>
  <circle cx="60" cy="35" r="8" fill="#febc2e"/>
  <circle cx="86" cy="35" r="8" fill="#28c840"/>
  <text x="600" y="43" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">PureLLM — generation</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21">
    <text x="34" y="112" fill="#7ee787">$</text>
    <text x="58" y="112" fill="#e6edf3">uv run python scripts/generate.py \</text>
    <text x="58" y="150" fill="#e6edf3">runs/tinygpt-shakespeare/5/checkpoints/best.pt "ROMEO:" \</text>
    <text x="58" y="188" fill="#e6edf3">--max-new-tokens 96 --temperature 0.8 --top-k 20 --seed 42</text>

    <text x="34" y="252" fill="#79c0ff">ROMEO:</text>
    <text x="34" y="294" fill="#e6edf3">To prove him ruled determinious hate with her:</text>
    <text x="34" y="336" fill="#e6edf3">And he had his absence proclaim on her discover'</text>
    <text x="34" y="390" fill="#8b949e">▌</text>
  </g>
</svg>
